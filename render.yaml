# Retained Static Site for rollback. Public Airbnb domains are served by the
# existing Node redirect service srv-d80u9tnlk1mc739ucneg with unchanged DNS.
services:
  - type: web
    name: shynliairbnbcleaning
    runtime: static
    repo: https://github.com/miralitys/shynliairbnbcleaning.git
    branch: main
    autoDeployTrigger: commit
    buildCommand: node scripts/prepare-onrender-redirect.mjs
    staticPublishPath: ./redirect-origin
    routes:
      - type: rewrite
        source: /*
        destination: https://shynlicom.onrender.com/__airbnb_redirect/*
    headers:
      - path: /*
        name: X-Robots-Tag
        value: noindex
