services:
  - type: web
    name: shynliairbnbcleaning
    runtime: static
    repo: https://github.com/miralitys/shynliairbnbcleaning.git
    branch: main
    autoDeployTrigger: commit
    buildCommand: npm ci && npm run build
    staticPublishPath: ./redirect-public
    routes:
      - type: rewrite
        source: /*
        destination: https://shynlicom.onrender.com/__airbnb_redirect/*
